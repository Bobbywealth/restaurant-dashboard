[build]
  command = ""
  publish = "frontend"

[build.environment]
  NODE_ENV = "production"

# Route all /api/* traffic to the serverless Express wrapper.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
