services:
  - name: restaurant-dashboard
    region: oregon
    runtime: node
    repo: https://github.com/Bobbywealth/restaurant-dashboard
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TOAST_CLIENT_ID
        sync: false
      - key: TOAST_CLIENT_SECRET
        sync: false
